name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python integration
        run: python -m compileall -q custom_components/avion_domicile
      - name: Validate metadata and aircraft catalogue
        run: python scripts/validate.py
      - name: Check Lovelace card syntax
        run: node --check www/avion-domicile-card.js
