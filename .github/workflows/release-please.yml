name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  package_release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release tag
        run: python scripts/validate.py --tag "${{ needs.release_please.outputs.tag_name }}"
      - name: Build Home Assistant archive
        id: package
        run: echo "asset=$(python scripts/package_release.py '${{ needs.release_please.outputs.tag_name }}')" >> "$GITHUB_OUTPUT"
      - name: Attach archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
